name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Run Python tests
        run: uv run --python 3.10 python -m unittest discover -s tests -v

      - name: Build Python distribution
        run: uv build

      - name: Build Obsidian release
        run: |
          docker run --rm -i \
            -u "$(id -u):$(id -g)" \
            -v "$PWD":/app \
            -w /app \
            node:20-alpine npm --prefix src/obsidian-tagg ci
          docker run --rm -i \
            -u "$(id -u):$(id -g)" \
            -v "$PWD":/app \
            -w /app \
            node:20-alpine npm --prefix src/obsidian-tagg run build:release

      - name: Build Thunderbird release
        run: |
          docker run --rm -i \
            -u "$(id -u):$(id -g)" \
            -v "$PWD":/app \
            -w /app \
            node:20-alpine npm --prefix src/thunderbird-tagg ci
          docker run --rm -i \
            -u "$(id -u):$(id -g)" \
            -v "$PWD":/app \
            -w /app \
            node:20-alpine npm --prefix src/thunderbird-tagg run build:release

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          (
            cd dist/obsidian-tagg
            zip -qr "../../release-assets/obsidian-tagg-${GITHUB_REF_NAME}.zip" .
          )

          (
            cd dist/thunderbird-tagg
            zip -qr "../../release-assets/thunderbird-tagg-${GITHUB_REF_NAME}.xpi" \
              background.js options.js options.html manifest.json
            tar -czf "../../release-assets/thunderbird-native-host-${GITHUB_REF_NAME}.tar.gz" \
              native-host
          )

          cp dist/tagg-*.whl release-assets/
          cp dist/tagg-*.tar.gz release-assets/

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true